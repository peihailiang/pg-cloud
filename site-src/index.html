<script>
(function () {
  'use strict';

  // ===== 首屏外壳：商品库 data.js 由「打开即下载」改为「按需加载」 =====
  // 首屏不再下载 ~160KB(gzip) 的商品库；点击热词 / 提交搜索 / 空闲时再按需拉取。
  var DATA_READY = !!(window.__DATA_PACK__), DATA_LOADING = false, BOOTED = false, PENDING_KW = null, STATUS_EL = null;

  // ================= 外壳期首屏：以下内容【不依赖商品库】 =================
  // DOM 一就绪就渲染/生效，不让用户为了看历史记录、折叠面板而白等 160KB 商品库。
  // boot() 跑起来后由内部同名逻辑接管，这里全部用 BOOTED 守卫，不会重复触发。
  var HIST_KEY_S = 'pgbj_history_v1', FOLD_KEY_S = 'pgbj_fold_v1';

  // 用户在外壳期发起的关键词(点历史/热词)：先记下，商品库到位后自动接着比价
  function shellGo(kw, el) {
    var inp = document.getElementById('kwInput');
    if (inp) inp.value = kw;
    PENDING_KW = kw;
    if (DATA_READY) runBoot(); else startLoad(el);
  }

  function shellHistory() {
    var list = document.getElementById('historyList');
    if (!list) return;
    var bar = document.getElementById('historyBar'), fold = document.getElementById('foldHistoryBtn');
    var arr = [];
    try { var raw = localStorage.getItem(HIST_KEY_S); arr = raw ? JSON.parse(raw) : []; } catch (e) { arr = []; }
    if (!Array.isArray(arr)) arr = [];
    if (!arr.length) { if (bar) bar.hidden = true; if (fold) fold.hidden = true; return; }
    if (bar) bar.hidden = false;
    if (fold) fold.hidden = false;
    list.innerHTML = '';
    var show = arr.slice(0, 50);
    for (var i = 0; i < show.length; i++) (function (kw) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'history-tag';
      b.textContent = kw;
      b.title = kw;
      b.addEventListener('click', function () { if (BOOTED) return; shellGo(kw, b); });
      list.appendChild(b);
    })(show[i]);
  }

  function shellFold() {
    var fs = {};
    try { fs = JSON.parse(localStorage.getItem(FOLD_KEY_S) || '{}') || {}; } catch (e) { fs = {}; }
    [['history', 'foldHistoryBtn', 'foldHistoryBody'], ['hot', 'foldHotBtn', 'foldHotBody']].forEach(function (t) {
      var btn = document.getElementById(t[1]), body = document.getElementById(t[2]);
      if (!btn || !body) return;
      var c = fs[t[0]] === true;
      body.classList.toggle('collapsed', c);
      btn.classList.toggle('collapsed', c);
      btn.setAttribute('aria-expanded', c ? 'false' : 'true');
      btn.addEventListener('click', function () {
        if (BOOTED) return;
        var nc = body.classList.toggle('collapsed');
        btn.classList.toggle('collapsed', nc);
        btn.setAttribute('aria-expanded', nc ? 'false' : 'true');
        try { var o = JSON.parse(localStorage.getItem(FOLD_KEY_S) || '{}') || {}; o[t[0]] = nc; localStorage.setItem(FOLD_KEY_S, JSON.stringify(o)); } catch (e) {}
      });
    });
  }

  // 本机是否今日已计数(访问统计)，避免 shell 与 boot 两次计数
  function initVisitStat() {
    var el = document.getElementById('visitStat');
    if (!el) return;
    function pad2(x) { return (x < 10 ? '0' : '') + x; }
    var d = new Date();
    var day = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
    var key = 'pinggai-bijia/' + day;
    var base = 'https://abacus.jasoncameron.dev/';
    function show(n) { el.innerHTML = '今日 <b>' + n + '</b> 人访问'; el.hidden = false; }
    var seenKey = 'pgbj_visit_' + day, seen = false;
    try { seen = localStorage.getItem(seenKey) === '1'; } catch (e) {}
    if (seen) {
      fetch(base + 'get/' + key).then(function (r) { return r.json(); }).then(function (j) { if (j && typeof j.value === 'number') show(j.value); })
        .catch(function () { show('-'); });
    } else {
      fetch(base + 'hit/' + key).then(function (r) { return r.json(); }).then(function (j) {
        if (j && typeof j.value === 'number') { show(j.value); try { localStorage.setItem(seenKey, '1'); } catch (e) {} }
      }).catch(function () {});
    }
  }

  var shellClear = document.getElementById('historyClear');
  if (shellClear) shellClear.addEventListener('click', function () {
    if (BOOTED) return;
    try { localStorage.setItem(HIST_KEY_S, '[]'); } catch (e) {}
    shellHistory();
  });
  shellHistory();
  shellFold();
  // 访问统计走的是境外服务（实测首字节 2.6s+），放到首屏空下来之后再发，
  // 免得在手机上跟商品库抢那点跨境带宽。
  (function () {
    var run = function () { initVisitStat(); };
    if ('requestIdleCallback' in window) window.requestIdleCallback(run, { timeout: 3000 });
    else setTimeout(run, 2000);
  })();
  // ================= 外壳期首屏结束 =================

  // 失败才提示；等待期不再显示文字，改由 .pg-loading 在按钮上转小圈
  function setHomeStatus(txt) {
    var hb = document.getElementById('hotTags');
    if (!hb || !hb.parentNode) return;
    if (STATUS_EL && STATUS_EL.parentNode) STATUS_EL.parentNode.removeChild(STATUS_EL);
    STATUS_EL = null;
    if (!txt) return;
    STATUS_EL = document.createElement('span');
    STATUS_EL.style.cssText = 'display:block;color:#8a9099;font-size:12.5px;padding:2px 2px 6px';
    STATUS_EL.textContent = txt;
    hb.parentNode.insertBefore(STATUS_EL, hb);
  }
  // 等待商品库时在被点元素上做的轻量反馈
  var LOAD_MARKS = [];
  function markLoading(el) {
    if (!el || !el.classList) el = document.getElementById('goBtn');
    if (!el || !el.classList) return;
    el.classList.add('pg-loading');
    el.setAttribute('aria-busy', 'true');
    LOAD_MARKS.push(el);
  }
  function clearLoading() {
    while (LOAD_MARKS.length) {
      var el = LOAD_MARKS.pop();
      if (el && el.classList) { el.classList.remove('pg-loading'); el.removeAttribute('aria-busy'); }
    }
  }
  // ---- 商品库加载：失败自动重试 ----
  // 背景（2026-10-01 实测）：surge 的边缘节点会偶发返回**损坏的 data.js** ——
  // 解压后长度正确、首尾也正常，但中间字节错位，浏览器解析直接抛 SyntaxError，
  // 于是 window.__DATA_PACK__ 永远不会被赋值，页面就变成"搜索没结果"。
  // 实测复现率约 1/4（HTTP/1.1 与 HTTP/2 都会，与是否走 SW 无关）。
  // 对策：加载后检查 __DATA_PACK__ 是否真的出现，没有就换一个带随机参数的地址重试，
  // 命中另一个边缘副本。这样即使某个节点持续损坏，用户侧也能自愈。
  var DATA_TRIES = 0, DATA_MAX_TRIES = 3, DATA_EL = null;
  function startLoad(triggerEl, isRetry) {
    if (DATA_READY) return;
    if (!isRetry && DATA_LOADING) return;
    DATA_LOADING = true;
    if (!isRetry) markLoading(triggerEl);
    if (DATA_EL && DATA_EL.parentNode) DATA_EL.parentNode.removeChild(DATA_EL);
    var s = document.createElement('script');
    // 首次用裸地址（可与 head 的预取命中同一份），重试时带随机参数绕开损坏副本
    s.src = 'data.js' + (DATA_TRIES ? '?r=' + DATA_TRIES + '_' + Date.now() : '');
    DATA_EL = s;
    s.onload = function () {
      if (window.__DATA_PACK__) {
        DATA_LOADING = false; DATA_TRIES = 0;
        clearLoading();
        DATA_READY = true;
        runBoot();
        return;
      }
      // 下载成功但脚本没执行 —— 内容损坏，重试
      retryLoad(triggerEl);
    };
    s.onerror = function () { retryLoad(triggerEl); };
    document.head.appendChild(s);
  }
  function retryLoad(triggerEl) {
    DATA_TRIES++;
    if (DATA_TRIES > DATA_MAX_TRIES) {
      DATA_LOADING = false;
      clearLoading();
      setHomeStatus('商品库加载失败，请刷新重试');
      return;
    }
    setTimeout(function () { startLoad(triggerEl, true); }, 150);
  }
  function runBoot() {
    if (BOOTED || !DATA_READY) return;
    BOOTED = true;
    boot();
    if (PENDING_KW !== null) { var k = PENDING_KW; PENDING_KW = null; if (window.__compare) window.__compare(k); }
  }
  // 用户抢先交互：立刻开始加载并把关键词挂起，数据就绪后自动接着比价
  var shellKw = document.getElementById('kwInput');
  var shellForm = document.getElementById('searchForm');
  if (shellForm) shellForm.addEventListener('submit', function (e) {
    if (BOOTED) return;
    e.preventDefault();
    var v = shellKw ? String(shellKw.value || '').trim() : '';
    if (!v) return;
    PENDING_KW = v;
    if (DATA_READY) runBoot(); else startLoad(document.getElementById('goBtn'));
  });
  var shellHot = document.getElementById('hotTags');
  if (shellHot) shellHot.addEventListener('click', function (e) {
    if (BOOTED) return;
    var t = e.target;
    while (t && t !== shellHot && t.tagName !== 'BUTTON') t = t.parentNode;
    if (!t || t === shellHot) return;
    var kw = t.getAttribute('data-kw') || t.textContent;
    if (!kw) return;
    PENDING_KW = kw;
    if (shellKw) shellKw.value = kw;
    if (DATA_READY) runBoot(); else startLoad(t);
  });
  // 商品库预热：head 里已预取(快网)则首屏一就绪立即接管执行，点热词时通常已就绪；
  // 慢网/省流量没预取，则延后 2 秒再取，不跟首屏抢带宽。
  window.addEventListener('load', function () {
    if (DATA_READY || DATA_LOADING) return;
    if (window.__PG_PREFETCHED) { startLoad(); return; }
    setTimeout(startLoad, window.__PG_SLOW_NET ? 4000 : 2000);
  });

  function boot() {
  var DATA_PACK = window.__DATA_PACK__;
  if (!DATA_PACK) {
    // 商品库没到位。首屏的静态热词仍然可用，不要清掉它。
    var hb0 = document.getElementById('hotTags');
    if (hb0 && !hb0.children.length) hb0.innerHTML = '<span style="color:#8a9099;font-size:13px">数据加载失败，请刷新重试</span>';
    return;
  }
  var SITE_LIST = DATA_PACK[0];
  var NAME_LIST = DATA_PACK[1];
  var HOST_LIST = DATA_PACK[2];
  // ---- 来源网站归并:同一网站的不同名称统一为一个 -------
  var SITE_ALIAS = {
    '逍遥瓶盖': '逍遥'
  };
  function canonSite(s) {
    s = String(s == null ? '' : s).trim();
    return SITE_ALIAS[s] || s;
  }
  // 来源站名统一截断到 3 个字以内
  var SITE_NAME_MAX = 3;
  function shortSite(s) {
    var v = String(s == null ? '' : s);
    var a = Array.from(v);
    return a.length > SITE_NAME_MAX ? a.slice(0, SITE_NAME_MAX).join('') : v;
  }
  // 收录清单内的来源站域名集合 —— 聚合源数据只允许收录清单内的站,
  // 避免把已删除或清单外的站重新带入结果。
  var ALLOW_HOSTS = {};
  (function () {
    for (var _i = 0; _i < HOST_LIST.length; _i++) { ALLOW_HOSTS[String(HOST_LIST[_i]).toLowerCase().replace(/^www\./, '')] = 1; }
  })();
  function hostAllowed(u) { var h = hostOf(u).replace(/^www\./, ''); return !!ALLOW_HOSTS[h]; }
  var ALL_PRODUCTS = DATA_PACK[3].map(function (r) {
    var sv = Number(r[3]) || 0;
    var nm = NAME_LIST[r[1]];
    var hp = r[4];
    return {
      site: shortSite(canonSite(SITE_LIST[r[0]])),
      name: nm, nname: nm,
      price: Number(r[2]),
      stockRaw: sv, stock: sv,
      url: (r[5] ? 'https://' : 'http://') + HOST_LIST[hp[0]] + (hp[1] ? '/' + hp[1] : ''),
      logo: null
    };
  });
  // 热门关键词:仅在候选池内有实际在售商品的词中,按各词在售库存总量(热度)降序取前 21(7 列 × 3 行)

  // 名称归一化:去内部来源标记与头尾装饰符号,合并连续空白
  function normalizeName(raw) {
    return String(raw || '')
      .replace(/（来自[^）]*）/g, '')
      .replace(/\(来自[^)]*\)/g, '')
      .replace(/^[\s★☆❀✦✧·•\-—–]+/, '')
      .replace(/[\s★☆❀✦✧·•]+$/, '')
      .replace(/\s+/g, ' ')
      .trim();
  }



  // ---- 热词池 & 搜索热度 ----
  // 数据段**自动定位**，避免新旧格式错配时取错段：
  //   新格式（7 段，2026-10-01 起）[店铺, 商品名, 域名, 报价行, 搜索热度, 词池, 软词]
  //   旧格式（8 段）中间多一个「库存快照」（已彻底移除）
  // 词池的形态是「字符串数组」，以此为锚点即可在新旧两种格式下都取对。
  var KW_IDX = -1;
  for (var scanIdx = 4; scanIdx < DATA_PACK.length; scanIdx++) {
    var scanSeg = DATA_PACK[scanIdx];
    if (scanSeg && scanSeg.length && typeof scanSeg[0] === 'string') { KW_IDX = scanIdx; break; }
  }
  // 兜底：data.js 异常时退回 21 个核心词，保证首页热词不为空。
  var KW_POOL = (KW_IDX >= 0) ? DATA_PACK[KW_IDX] : [
    "东鹏", "补水", "东方树叶", "王老吉", "康师傅", "脉动", "绿茶", "外星人", "加多宝", "元气森林",
    "可乐", "农夫山泉", "电解质", "无糖", "海之言", "雪碧", "芬达", "芙蓉王", "乌苏", "苏打水", "冰红茶"
  ];
  // 搜索热度（上一轮采集读回的真实搜索次数，紧挨词池的前一段）。冷启动时为空对象。
  var SEARCH_HEAT = (KW_IDX > 0 && DATA_PACK[KW_IDX - 1]) || {};
  // 操作类词（紧挨词池的后一段，如「红包/扫码/激活码」）：商品基数大但不是商品品类，
  // 未被真实搜过时一律沉底，避免首页热门关键词被它们占满。
  var SOFT_KW = {};
  ((KW_IDX >= 0 && DATA_PACK[KW_IDX + 1]) || []).forEach(function (w) { SOFT_KW[w] = 1; });

  /** FNV-1a 32bit → base36。必须与 pg_kw_pool.js 的 hashKey 逐字节一致 */
  function kwHash(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i) & 0xffff;
      h = Math.imul(h, 0x01000193) >>> 0;
      h ^= (s.charCodeAt(i) >> 16) & 0xffff;
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(36);
  }

  // ---- 本机搜索热度：「自己搜过的词」立刻进首页热门关键词 ----
  // 全局热度要等采集侧读回（最快 2 小时），但用户自己搜过的词可以立即生效：
  // 本地记一份计数，buildHotKeywords 排序时叠加。口径与上报一致（只记词池内的词）。
  var MY_HEAT_KEY = 'pgbj_my_heat_v1';
  var MY_HEAT_MAX = 40;                        // 最多保留 40 个词，避免越存越多
  var MY_HEAT_TTL = 30 * 24 * 3600 * 1000;     // 30 天内没再搜过就不再计入
  function readMyHeat() {
    try {
      var j = JSON.parse(window.localStorage.getItem(MY_HEAT_KEY) || '{}');
      return (j && typeof j === 'object') ? j : {};
    } catch (e) { return {}; }
  }
  function bumpMyHeat(kw) {

  function aggFetchProxy(kw, done) {
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 12000) : null;
    fetch('/api/search?kw=' + encodeURIComponent(kw), { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (j) {
        if (timer) clearTimeout(timer);
        if (!j || j.status !== 'success' || !Array.isArray(j.rows)) return done(null);
        done(j.rows);
      })
      .catch(function () { if (timer) clearTimeout(timer); done(null); });
  }
  // 本地/局域网访问时才有 /api/search 实时代理；公网静态托管没有它 → 无聚合兜底，库存只靠来源站直连
  function aggRefresh(kw, done) {
    // 2026-10-04：聚合源（本地 /api/search → bj.wzjfk.cn/Search.php）已彻底停用。
    // 原因：它只是「定时快照库」，库存常为陈旧值。实测大水网安慕希源站实时库存为 0，
    // 它却返回 1189，会把缺货误判成有货（反之亦然），因此不再作为任何数据来源。
    // 现在唯一的实时来源是本地采集器产出的 live_all.json（见 refreshLive）：
    // 覆盖 68 站、10 分钟一轮、全部直读源站接口，无任何第三方托底。
    return done(null);
  }
  // 将聚合实时行合并进结果：已存在的行更新价格/库存；新增行追加（来自聚合站收录的来源站，覆盖面完整）
  function mergeAggRows(rows) {
    var seen = {};
    for (var i = 0; i < allRows.length; i++) { var r = allRows[i]; seen[hostOf(r.url) + '|' + (gidOf(r.url) || String(r.pname))] = 1; }
    var added = 0;
    for (var k = 0; k < rows.length; k++) {
      var row = rows[k]; // [siteName, name, price, stock, url]
      var url = row[4]; if (!url) continue;
      var host = hostOf(url), g = gidOf(url);
      if (!host || !/^[a-z0-9.\-]+(?::\d+)?$/.test(host)) continue;
      if (!hostAllowed(url)) continue; // 仅收录清单内来源站，清单外(含已删除站)一律丢弃
      var nm = String(row[1] || '').trim();
      var pv = Number(row[2]) || 0;
      if (!nm || !aggRowOk(nm, pv)) continue;
      var key = host + '|' + (g || nm);
      if (seen[key]) continue;
      seen[key] = 1;
      STOCK_CACHE[key] = { n: Number(row[3]) || 0, t: Date.now() };
      allRows.push({
        site: shortSite(canonSite(String(row[0] || host))),
        badge: undefined, logo: undefined,
        pname: nm,
        price: pv,
        stock: (Number(row[3]) || 0) > 0 ? 'in' : 'out',
        stockRaw: Number(row[3]) || 0,
        url: resolveUrl(url)
      });
      added++;
    }
    return added;
  }
  function applyAggMap(map, src) {
    var cards = document.querySelectorAll('#result .rcard');
    var hit = 0;
    for (var i = 0; i < cards.length; i++) {
      var row = cards[i].__row; if (!row) continue;
      // 云商城站交由直连(/ajax/item + /get_api_stock)核实,比聚合源更准,这里跳过
      if (YUNBAO_HOSTS[canonHost(row.url)]) continue;
      // 只更新清单内来源站，清单外(含已删除站)一律不采信聚合源
      if (!hostAllowed(row.url)) continue;
      var e = map[aggStockKey(row.url, row.pname)];
      if (!e) continue;
      hit++;
      if (e.price > 0) row.price = e.price;
      applyLiveStock(row, cards[i], e.stock);
    }
    return hit;
  }
  function refreshVisibleStock(force, silent) {
    var cards = document.querySelectorAll('#result .rcard');
    if (!cards.length) return;
    var label0 = refreshBtn.textContent;
    if (!silent) { refreshBtn.classList.add('busy'); refreshBtn.textContent = '刷新中…'; }
    function restore() { if (!silent) { refreshBtn.classList.remove('busy'); refreshBtn.textContent = label0; } }
    function perRow() {
      var vh = window.innerHeight || 800, list = [], n = 0;
      for (var i = 0; i < cards.length; i++) {
        var rc = cards[i].getBoundingClientRect();
        if (rc.bottom > -300 && rc.top < vh + 300) list.push(cards[i]);
      }
      if (!list.length) { restore(); return; }
      for (var j = 0; j < list.length; j++) {
        (function (card) {
          var row = card.__row;
          if (!row || !gidOf(row.url)) return;
          var isY = !!YUNBAO_HOSTS[canonHost(row.url)];
          // 公网：采集产物(live_all.json)已提供值的行不再直连核实 —— 那边源站跨域，
          //   直连必失败（大水没有 /ajax/item 与 /get_api_stock），会把值抹成 null 误判缺货。
          // 本地/局域网：不管有没有快照都要直连核实 —— 本地要的是「搜索即实时」，快照是 30 分钟的、偏旧。
          if (!IS_LOCAL_HOST) {
            var lk = canonHost(row.url).replace(/^www\./, '') + '|' + gidOf(row.url);
            if (LIVE_INDEX && LIVE_INDEX[lk]) return;
          }
          // 云商城站:一律直连(库存/价格最准); 非云商城站:聚合源已覆盖则跳过,避免多余请求
          if (!isY && AGG_MAP && AGG_MAP[aggStockKey(row.url, row.pname)]) return;
          n++;
          fetchLiveStock(row, function (v) {
            if (v !== null) applyLiveStock(row, card, v);
            n--;
            if (n <= 0) restore();
          }, !!force);
        })(list[j]);
      }
      if (n === 0) restore();
    }
    // 先用聚合代理一次性覆盖全站，取不到再逐站补齐
    aggRefresh(currentKw, function (res) {
      if (res && res.map) { AGG_MAP = res.map; applyAggMap(res.map, res.src); }
      // 始终进入 perRow: 云商城站直连核实, 聚合未覆盖的行补齐
      perRow();
      refreshLive();   // 全站采集产物覆盖（yunbao/haoquanyi/spa 三类，不经跨域）
    });
  }
  refreshBtn.addEventListener('click', function () { refreshVisibleStock(true, false); });

  // 回到页面/切回标签页时，如缓存过期则静默重拉可见行
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) refreshVisibleStock(false, true);
  });
  window.addEventListener('focus', function () { refreshVisibleStock(false, true); });

  // 结果可见时，每 45 秒静默刷新一次可见行的库存
  setInterval(function () {
    if (document.hidden) return;
    if (!result.classList.contains('show')) return;
    refreshVisibleStock(false, true);
  }, 45000);

  // ---- 大水网(wx.walo888.com)专用：源站接口不带 CORS，浏览器无法直连 ----
  // ---- 全站实时覆盖：本地采集器 crawl_all.py 每 10 分钟扫全部来源站 ----
  // 覆盖 yunbao(40)/haoquanyi(13)/spa(14) 三类共 67 站，产出 live_all.json：
  //   { scraped_at, sites, total_items, data: { host: { site, host, program, count, items:[{gid,title,price,stock,...}] } } }
  // 页面按 host|gid 精确匹配当前结果行，覆盖价格与库存（不新增行，避免脏数据）。
  var LIVE_URL = 'live_all.json';
  var LIVE_INDEX = null;      // host|gid -> item
  var LIVE_TS = 0;
  function buildLiveIndex(j) {
    var data = (j && j.data) || {}, idx = {}, n = 0, h, arr, i;
    for (h in data) {
      if (!Object.prototype.hasOwnProperty.call(data, h)) continue;
      arr = data[h].items || [];
      for (i = 0; i < arr.length; i++) {
        var it = arr[i];
        if (!it || !it.gid) continue;
        idx[h.toLowerCase().replace(/^www\./, '') + '|' + it.gid] = it;
        n++;
      }
    }
    LIVE_INDEX = (n > 0) ? idx : null;
    LIVE_TS = (j && j.ts) || Date.now();
    return n;
  }
  function refreshLive(force) {
    if (typeof fetch !== 'function') return;
    fetch(LIVE_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (j) {
        // 拉回成功才替换索引：避免请求飞行期间 LIVE_INDEX 为空导致
        // perRow 误判「无实时数据」而去做注定失败的直连核实。
        buildLiveIndex(j);
        applyLiveIndex();
      })
      .catch(function () { /* 产物缺失或离线时静默跳过，保留原值 */ });
  }
  function applyLiveIndex() {
    if (!LIVE_INDEX) return;
    var cards = document.querySelectorAll('#result .rcard'), hit = 0, i;
    for (i = 0; i < cards.length; i++) {
      var card = cards[i], row = card.__row;
      if (!row) continue;
      var host = canonHost(row.url).replace(/^www\./, '');
      var g = gidOf(row.url);
      if (g === null) continue;
      var e = LIVE_INDEX[host + '|' + g];
      if (!e) continue;
      hit++;
      var nv = Number(e.price);
      if (isFinite(nv) && nv > 0) row.price = nv;
      var nst = Number(e.stock);
      // 同步写入 STOCK_CACHE：采集产物已是权威实时值，
      // 否则逐站直连核实失败时（如大水没有 get_api_stock）会把值抹掉导致误判缺货。
      STOCK_CACHE[host + '|' + g] = { n: nst, t: Date.now(), src: 'live' };
      applyLiveStock(row, card, nst);
    }
    if (hit) markTick();
    return hit;
  }
  // 采集器 10 分钟一轮，页面 5 分钟拉一次足够跟上
  setInterval(function () {
    if (document.hidden) return;
    refreshLive();   // 拉回成功后整体替换索引，保证商品增减也能跟上
  }, 300000);
  historyClear.addEventListener('click', function () { history = []; saveHistory(); renderHistory(); });
  // ---- 折叠状态记忆(刷新/重开网页保留) ----
  var FOLD_KEY = 'pgbj_fold_v1';
  function loadFold() { try { return JSON.parse(window.localStorage.getItem(FOLD_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function saveFold(o) { try { window.localStorage.setItem(FOLD_KEY, JSON.stringify(o)); } catch (e) { /* ignore */ } }
  var foldState = loadFold();
  function applyFold(name, btn, body) {
    var collapsed = foldState[name] === true;
    body.classList.toggle('collapsed', collapsed);
    btn.classList.toggle('collapsed', collapsed);
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  }
  function toggleFold(name, btn, body) {
    var collapsed = body.classList.toggle('collapsed');
    btn.classList.toggle('collapsed', collapsed);
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    foldState[name] = collapsed;
    saveFold(foldState);
  }
  applyFold('history', foldHistoryBtn, foldHistoryBody);
  applyFold('hot', foldHotBtn, foldHotBody);
  foldHistoryBtn.addEventListener('click', function () { toggleFold('history', foldHistoryBtn, foldHistoryBody); });
  foldHotBtn.addEventListener('click', function () { toggleFold('hot', foldHotBtn, foldHotBody); });

  loadHistory();
  renderHistory();
  renderHotTags();
  renderEmptyKws();
  window.__compare = startCompare;
  }
  // ⚠️ 这里绝不能在 DOMContentLoaded 上直接调 boot()：商品库是异步按需加载的，
  // 早调会走"数据加载失败"分支，把首屏已经渲染好的热词整块清掉。
  // 慢网手机上表现就是——页面刚打开先弹一行"数据加载失败，请刷新重试"，要等商品库到了才好。
  // 数据就绪后的启动统一走 runBoot()（内含 BOOTED 守卫与挂起关键词的接续）。
  if (DATA_READY) runBoot();

  // ⚠️ Service Worker 已于 2026-10-01 停用，不要再注册。
  // 原因：SW 拦截了商品库 data.js，在部分网络下返回损坏/不完整内容，
  // 表现为 window.__DATA_PACK__ 未定义 → 首屏无热词、搜索完全没结果。
  // 该故障只出现在线上（本地不走 SW），手机与电脑上都会复现。
  // 现改用 surge 自带的 ETag（重复访问 304、不回传正文）兜底。
  // sw.js 保留一个「自毁版」：已注册的老用户访问一次即自动清缓存并注销。
})();
</script>
