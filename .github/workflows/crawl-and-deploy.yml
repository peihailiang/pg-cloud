name: crawl-and-deploy

# 每 30 分钟采集一次全部来源站，产出 live_all.json 并部署到 Surge。
# 跑在 GitHub 的服务器上，用户本机关机也照常运行。
on:
  schedule:
    # GitHub 的 cron 用 UTC。每 30 分钟一次（0 和 30 分）。
    # 注意：GitHub 排队繁忙时可能延迟 5-15 分钟，属正常。
    - cron: '*/30 * * * *'
  workflow_dispatch:        # 支持手动触发（Actions 页面点 Run workflow）
  # 2026-10-06：改了采集器或站点清单后，推送即立刻重采一次并部署，
  # 不用等下一个 30 分钟刻度。
  push:
    branches: [main]
    paths:
      - 'crawler.py'
      - 'sites.json'
      - 'site-src/**'

# 防止上一轮没跑完就叠加下一轮
concurrency:
  group: crawl-deploy
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25          # 采集正常约 1 分钟，给足余量

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 2026-10-06：13 个源站对境外 IP 只让连通、不给数据（返回 456/403/502），
      # 云端采不到它们。runner 每轮都是全新环境，dist/ 又不进仓库，
      # 于是 crawler.py 里「失败站点沿用上一轮」的护栏在云端完全失效 → 整站归零。
      # 这里用 cache 把上一轮产物带回来；首次运行没有缓存时，用仓库内的种子快照兜底。
      - name: 取回上一轮快照
        uses: actions/cache@v4
        with:
          path: dist/live_all.json
          key: live-all-${{ github.run_id }}
          restore-keys: |
            live-all-

      - name: 无缓存时用种子快照初始化
        run: |
          mkdir -p dist
          if [ ! -s dist/live_all.json ]; then
            echo "无上一轮缓存 → 用仓库内的种子快照初始化（含境外采不到的那些站）"
            cp seed-live.json dist/live_all.json
          else
            echo "已取回上一轮快照"
            ls -la dist/live_all.json
          fi

      - name: 采集 68 站实时库存
        env:
          PG_SITES_JSON: ${{ github.workspace }}/sites.json
          PG_OUT_FILE: ${{ github.workspace }}/dist/live_all.json
        run: |
          mkdir -p dist
          python crawler.py

      - name: 校验产物
        run: |
          python - <<'PY'
          import json, os, sys
          p = 'dist/live_all.json'
          if not os.path.isfile(p):
              sys.exit('产物不存在：' + p)
          j = json.load(open(p, encoding='utf-8'))
          sites = j.get('sites') or 0
          items = j.get('total_items') or 0
          print('站点 %d / 商品 %d / 时间 %s' % (sites, items, j.get('scraped_at')))
          # 兜底：采到的站太少说明网络出了问题，别把坏数据推上线
          if sites < 40 or items < 2000:
              sys.exit('采集结果异常（站点或商品数过少），中止部署')
          PY

      - name: 组装发布目录（页面 + 新快照）
        run: |
          mkdir -p site
          # 静态资源从仓库里的 site-src 复制（页面 / 商品库 / 图标等）
          cp -r site-src/. site/
          # 用刚采到的新快照覆盖旧的
          cp dist/live_all.json site/live_all.json
          ls -la site/ | head -20

      - name: 部署到 Surge
        env:
          # 优先用仓库 Secret；Secret 还没配时回退到内置 token，保证链路能先跑起来。
          # ★ 安全提醒：正式使用请在 Settings → Secrets 里配 SURGE_TOKEN，并删掉下面的回退值。
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN != '' && secrets.SURGE_TOKEN || '1597874172653166e4f6467f74630d49' }}
        run: |
          npx --yes surge@0.44.3 site pinggai-bijia.surge.sh
